<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} · {{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/navigation.css" | relative_url }}">
</head>
<body id="page-top">
<a class="skip-link" href="#main">Skip to content</a>
{% include page-navigation.html position="top" %}
<main id="main" tabindex="-1">
{{ content }}
</main>
<script type="module">
  // kramdown/Rouge emits ```mermaid fences as code blocks; swap them for live diagrams.
  const blocks = document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid');
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    blocks.forEach(b => {
      const host = b.matches('div') ? b : b.parentElement;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = (host.querySelector('code') || host).textContent;
      host.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
    await mermaid.run({ querySelector: '.mermaid' });
  }
</script>
{% include page-navigation.html position="bottom" %}
<footer><a href="https://github.com/mdtausifahmad/principal-engineering/blob/main/{{ page.path }}">View source</a></footer>
<script src="{{ "/assets/course/links.js" | relative_url }}" defer></script>
</body>
</html>
