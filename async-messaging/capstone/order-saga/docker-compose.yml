# Local infrastructure for the capstone. Runtime-agnostic compose:
#   podman compose up -d      (or:  docker compose up -d)
#
#   Kafka UI  → http://localhost:8080
#   Jaeger    → http://localhost:16686
#   Postgres  → localhost:5432   (db=ordersaga user=app pass=app)
#   Kafka     → localhost:9092   (from the host app)

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: capstone-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Two listeners: HOST (for the app on your machine) and INTERNAL (for other containers, e.g. kafka-ui)
      KAFKA_LISTENERS: HOST://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://capstone-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared explicitly in KafkaConfig (Lesson 03/09)

  postgres:
    image: postgres:16
    container_name: capstone-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ordersaga
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ordersaga"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: capstone-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: capstone-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: capstone-kafka:29092
    depends_on:
      - kafka
