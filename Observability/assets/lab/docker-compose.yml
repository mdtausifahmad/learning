# Minimal local observability lab:  app -> Collector -> Prometheus + Jaeger -> Grafana
# Run:  docker compose up -d      Stop:  docker compose down

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest   # pin e.g. :0.157.0 for real use
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"    # OTLP gRPC  <- point your app here
      - "4318:4318"    # OTLP HTTP
      - "8889:8889"    # Prometheus scrape endpoint (metrics)

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"    # Prometheus UI / PromQL

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI (traces)

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"    # Grafana UI
